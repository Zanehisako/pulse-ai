[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pios-backend"
version = "2.0.0"
description = "PIOS - Plateforme Intelligente d'Optimisation Sanguine"
requires-python = ">=3.11,<3.14"
dependencies = [
  # ── Django stack ──────────────────────────
  "Django>=5.0",
  "djangorestframework>=3.16.1",
  "django-cors-headers>=4.0",
  "django-filter>=24.0",
  "drf-spectacular>=0.27.0",
  "channels>=4.0",
  "daphne>=4.0",
  "python-dotenv>=1.2.2",
  "pymongo>=4.16",
  "APScheduler>=3.11.2",
  
  # ── keycloak stack ──────────────────────────────
  "python-keycloak>=7.1.1",
  "PyJWT>=2.12.1",
  "cryptography>=46.0.6",

  # ── Database ──────────────────────────────
  "psycopg2-binary>=2.9",
  "pymongo>=4.16.0",
  "dnspython>=2.8.0",
  # ── WebSocket ─────────────────────────────
  "websocket-client>=1.8",

  # ── ML Core ───────────────────────────────
  "numpy>=1.26.0,<2.3",
  "pandas>=2.0.0,<3.0",
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",

  # ── ML Models (used by .pkl files) ────────
  "xgboost>=2.0.0",
  "catboost>=1.2",
  "lightgbm>=4.0.0",

  # ── xLAM Orchestrator (LLM) ──────────────
  "huggingface-hub>=0.23.0",
  "llama-cpp-python==0.3.28",

  # Mlops
  "feast==0.58.0",
  "mlflow==2.22.5",
  "pyarrow==19.0.1",
  "pyspark>=4.1.0",
  "SQLAlchemy>=2.0",
  
  #Simulation
  "osmnx>=2.1.0",
  "simpy>=4.1.0",

  # ── MLflow runtime ───────────────────────
  "mlflow-skinny==2.22.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-django>=4.5.0",
  "pytest-cov>=4.0.0",
]
mlops = [
  "feast==0.58.0",
  "pyarrow==19.0.1",
  "SQLAlchemy>=2.0",
]
spark = [
  "pyspark==4.1.2",
]
training = [
  "torch>=2.0.0",
]
dreamerv3 = [
  "jax==0.4.33",
  "jaxlib==0.4.33",
  "elements>=3.19.1",
  "portal>=3.5.0",
  "ruamel.yaml",
  "chex",
  "ninjax>=3.5.1",
  "optax",
  "granular>=0.20.3",
  "scope>=0.4.4",
  "einops",
  "colored_traceback",
  "jaxtyping",
]
full-ml = [
  "feast==0.58.0",
  "pyarrow==19.0.1",
  "SQLAlchemy>=2.0",
  "pyspark==4.1.2",
  "torch>=2.0.0",
]

[tool.setuptools]
packages = [
  "backendMulti",
  "authApp",
  "inventory",
  "notifications",
  "testUrl",
  "dashboard",
  "digital_twin",
  "ml",
  "ml.core",
  "ml.orchestrator",
  "ml.services",
  "ml.api",
  "ml.management",
  "ml.management.commands",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backendMulti.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
