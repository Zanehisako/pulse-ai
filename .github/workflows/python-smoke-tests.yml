name: Python Smoke Tests

on:
  pull_request:
    paths:
      - "ml-backend/**"
      - "backendMulti/**"
      - ".github/workflows/python-smoke-tests.yml"
  push:
    branches:
      - dev
    paths:
      - "ml-backend/**"
      - "backendMulti/**"
      - ".github/workflows/python-smoke-tests.yml"

permissions:
  contents: read

concurrency:
  group: python-smoke-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-schedule-imports:
    name: Training schedule imports
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DJANGO_SKIP_ML_INIT: "1"
      DJANGO_SKIP_SIMULATION: "1"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            "Django>=5.0" \
            "djangorestframework>=3.16.1" \
            "django-cors-headers>=4.0" \
            "django-filter>=24.0" \
            "drf-spectacular>=0.27.0" \
            "channels>=4.0" \
            "daphne>=4.0" \
            "anyio>=4.0" \
            "python-dotenv>=1.2.2" \
            "APScheduler>=3.11.2" \
            "psycopg2-binary>=2.9" \
            "numpy>=1.26.0" \
            "pandas>=2.0.0" \
            "scikit-learn>=1.3.0" \
            "matplotlib>=3.7.0" \
            "seaborn>=0.12.0" \
            "mlflow>=2.14,<3.0" \
            "catboost>=1.2" \
            "lightgbm>=4.0.0" \
            "xgboost>=2.0.0"

      - name: Import enabled training scripts
        run: python -m pytest ml-backend/tests/test_training_schedule_imports.py -q
