[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pios-simulation-studio"
version = "0.1.0"
description = "Standalone Simulation Studio for the PIOS blood supply simulator."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "numpy>=1.26,<3.0",
    "simpy>=4.1,<5.0",
    "networkx>=3.2,<4.0",
    "osmnx>=2.0,<3.0",
    "scipy>=1.12,<2.0",
    "statsmodels>=0.14,<1.0",
    "matplotlib>=3.8,<4.0",
    "torch>=2.2,<3.0",
    "stable-baselines3>=2.3,<3.0",
    "gymnasium>=0.29,<1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "simulation_studio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
