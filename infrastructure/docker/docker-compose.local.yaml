  simulation-studio:
    build:
      context: ../../simulation_studio
      dockerfile: ../infrastructure/dockerFiles/DockerfileSimulation
    container_name: pios-simulation-studio
    healthcheck:
      test: [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8010/api/health',
          timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default
    ports:
      - "8010:8010"
    environment:
      PIOS_SIM_OFFLINE: "1"
      XDG_CACHE_HOME: /tmp/.cache
      MPLCONFIGDIR: /tmp/matplotlib
  pgadmin:
    image: dpage/pgadmin4
    container_name: pios-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com # Change as desired
      PGADMIN_DEFAULT_PASSWORD: admin # Change as desired
    ports:
      - "5050:80" # Host port 5050 maps to pgAdmin's web interface
    depends_on:
      - postgres
    networks:
      - default
      - sonar-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../config/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_postgres_data:
  postgres_data:
  pgadmin_data:
  xlam_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../../ml-backend/models/gguf

networks:
  sonar-network:
    driver: bridge
