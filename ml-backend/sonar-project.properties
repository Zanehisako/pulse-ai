# Project Identification
sonar.projectKey=pios-ml-backend
sonar.projectName=PIOS ML Backend
sonar.projectVersion=1.0

# Source Configuration = which directories contain production code (not tests).
sonar.sources=pios_ml_backend
sonar.tests=tests
sonar.exclusions=**/venv/**,**/__pycache__/**,**/*.pyc,**/.git/**,**/datasets/**,**/models/**,**/data/**,**/mlruns/**,**/*.ipynb_checkpoints/**,**/*.gguf,**/*.pkl,**/*.db

# Python Specific
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8
