[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PIOS-ML-Backend"
version = "0.1.0"
description = "Modèle d'apprentissage automatique pour identifier les donneurs de sang idéaux en utilisant CatBoost et l'analyse comportementale."
readme = "README.md"
requires-python = ">=3.11,<3.14"

# Training-only dependencies not present in backendMulti/pyproject.toml.
# Shared deps (numpy, pandas, sklearn, xgboost, catboost, lightgbm, mlflow,
# feast, pyarrow, pyspark, huggingface-hub, llama-cpp-python, psycopg2-binary,
# joblib, apscheduler) are intentionally omitted — they come from backendMulti/.venv.
dependencies = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.31.0",
    "holidays>=0.30",           # crisis/event logic
    "prophet>=1.1,<2.0",
    "pydantic>=2.0,<2.12",
    "transformers>=4.41,<6.0",
    "trl",
    "peft",
    "bitsandbytes",
    "accelerate",
    "sentence-transformers",
    "gradio",
    "torch>=2.0.0",
]

[project.optional-dependencies]
# Dépendances nécessaires uniquement pour exécuter le notebook, pas le modèle lui-même
dev = [
    "jupyterlab==4.2.5",
    "notebook==7.2.2",
    "ipykernel==6.29.5",
    "pytest==7.0.0",           # ADD THIS for testing
    "pytest-cov==4.0.0",       # ADD THIS for coverage
    "coverage==7.0.0"          # ADD THIS for SonarQube coverage
]
# mlops extras removed — feast/mlflow/pyarrow live in backendMulti/pyproject.toml

[tool.setuptools.packages.find]
where = ["."]

# ==========================================
# SONARQUBE / COVERAGE CONFIGURATION - ADD THIS SECTION
# ==========================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["pios_ml_backend"]
branch = true
relative_files = true  # Critical for SonarQube path resolution in Docker
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "notebooks/*",
    "datasets/*",
    "models/*",
    "data/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]

[tool.coverage.xml]
output = "coverage.xml"
